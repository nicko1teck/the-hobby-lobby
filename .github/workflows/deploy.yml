# Builds the WAR and deploys it to Tomcat on Server A whenever master is pushed.
# Can also be started by hand from the repo's Actions tab ("Run workflow").
#
# No keys or passwords are stored for this. GitHub gives each run a short-lived
# OIDC token; AWS swaps it for a temporary role (github-deploy-hobby-lobby) that
# may only upload to the deploy bucket and run commands on Server A.
#
# Required repository VARIABLES (Settings > Secrets and variables > Actions > Variables):
#   AWS_DEPLOY_ROLE_ARN   ARN of the github-deploy-hobby-lobby role
#   EC2_INSTANCE_ID       Server A's instance ID
#
# The app's passwords are NOT here. They live in Tomcat's bin/setenv.sh on the server.
# Server A runs 7 AM to 10 PM Central; a deploy outside those hours will time out.
name: Deploy to EC2

on:
  push:
    branches: [master]
  workflow_dispatch:

# Never run two deployments at once.
concurrency:
  group: deploy-the-hobby-lobby
  cancel-in-progress: false

permissions:
  id-token: write   # lets the run request its OIDC token
  contents: read    # lets actions/checkout read the code

env:
  APP_NAME: the-hobby-lobby
  AWS_REGION: us-east-1
  BUCKET: nickowen-deploy-artifacts

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      # Tests are skipped on purpose: they use a real database and one creates users.
      - name: Build the WAR
        run: mvn -B -DskipTests clean package

      - name: Pick the WAR file
        run: |
          WAR=$(ls target/*.war | head -n 1)
          echo "Built: $WAR"
          cp "$WAR" "$APP_NAME.war"

      # Swap GitHub's OIDC token for temporary AWS credentials (pinned to a commit, as GitHub's docs show).
      - name: Get temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Each commit gets its own folder, so nothing is ever overwritten.
      - name: Upload the WAR and install script to S3
        run: |
          PREFIX="hobby-lobby/$GITHUB_SHA"
          aws s3 cp "$APP_NAME.war"     "s3://$BUCKET/$PREFIX/$APP_NAME.war" --only-show-errors
          aws s3 cp deploy/install.sh   "s3://$BUCKET/$PREFIX/install.sh"    --only-show-errors
          echo "PREFIX=$PREFIX" >> "$GITHUB_ENV"

      - name: Tell Server A to install it (SSM Run Command)
        run: |
          PARAMS=$(jq -n \
            --arg get "aws s3 cp s3://$BUCKET/$PREFIX/install.sh /tmp/hl-install.sh --only-show-errors" \
            --arg run "bash /tmp/hl-install.sh $BUCKET $PREFIX/$APP_NAME.war" \
            '{commands: [$get, $run]}')
          CMD_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.EC2_INSTANCE_ID }}" \
            --document-name AWS-RunShellScript \
            --comment "Deploy $APP_NAME ${GITHUB_SHA::7}" \
            --timeout-seconds 600 \
            --parameters "$PARAMS" \
            --query Command.CommandId --output text)
          echo "Command ID: $CMD_ID"
          echo "CMD_ID=$CMD_ID" >> "$GITHUB_ENV"

      - name: Wait for the result
        run: |
          STATUS="Pending"
          for i in $(seq 1 60); do
            sleep 5
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Pending|InProgress|Delayed) continue ;; *) break ;; esac
          done
          echo "Status: $STATUS"
          aws ssm get-command-invocation \
            --command-id "$CMD_ID" --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text || true
          if [ "$STATUS" != "Success" ]; then
            echo "::error::Deploy did not succeed (status: $STATUS). Is Server A running? It's scheduled 7 AM to 10 PM Central."
            exit 1
          fi
